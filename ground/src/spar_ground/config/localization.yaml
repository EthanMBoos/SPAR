    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    reset_on_time_jump: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    odom0: platform/wheel_odometry
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    imu0: sensors/imu/data
